<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisión por cuenta — Applaudo</title>
<style>
  :root{
    --card:#1D1D1B;
    --card-grad:linear-gradient(180deg,#272723 0%,#1E1E1C 100%);
    --card-grad-hi:linear-gradient(180deg,#2E2E29 0%,#232321 100%);
    --method-grad:linear-gradient(180deg,#2C2C28 0%,#222220 100%);
    --ink:#F1EFEB;
    --cap:#A9A49B;
    --line:rgba(255,255,255,.11);
    --wire:rgba(255,255,255,.46);
    --red:#F4626B;
    --red-line:rgba(244,98,107,.55);
    --red-tint:linear-gradient(180deg,rgba(244,98,107,.12) 0%,rgba(244,98,107,.04) 100%);
    --lift:0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.035);
    --lift-hi:0 10px 28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    --radius:12px;
    --wire-gap:34px;
    --font:"Poppins","Avenir Next","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  html.is-embed body{padding:2px 0 10px;min-height:0;overflow:visible}
  html.is-embed .page{min-height:0}
  body:not(.is-embed-body){padding:24px;display:flex;justify-content:center}
  .page{width:100%;max-width:1180px;margin:0 auto}
  .canvas{position:relative;width:100%;padding:8px 16px 12px}
  svg#links{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
  svg#links path{
    stroke:var(--wire);stroke-width:1.4;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
    transition:stroke .18s,opacity .18s;
  }
  svg#links polygon{fill:var(--wire);transition:fill .18s,opacity .18s}
  svg#links g{opacity:1;transition:opacity .18s}
  svg#links g.on path{stroke:var(--red)}
  svg#links g.on polygon{fill:var(--red)}
  .dimmed svg#links g:not(.on){opacity:.18}
  .dimmed .box:not(.on),.dimmed .team-card:not(.on),.dimmed .signal{opacity:.32}
  .dimmed .stack .seg:not(.on){opacity:.32}
  .vflow{
    position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
    gap:var(--wire-gap);width:100%;
  }
  .row{display:flex;align-items:stretch;justify-content:center;gap:18px;width:100%;max-width:1180px}
  .row.methods{align-items:stretch;gap:18px;padding:2px 0}
  .row.decisions .nodewrap,.row.methods .nodewrap{flex:1 1 0;min-width:0;max-width:none}
  .nodewrap{position:relative;width:100%}
  .nodewrap.center{max-width:520px;width:100%}
  .nodewrap.wide{max-width:1180px;width:100%}
  .box{
    width:100%;background:var(--card-grad);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;text-align:center;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);
    cursor:pointer;transition:.18s;box-shadow:var(--lift);display:block;
  }
  .box.decision{font-size:12.5px;line-height:1.38;padding:16px 18px;font-weight:600}
  .box.method{
    background:var(--method-grad);padding:22px 18px 20px;min-height:104px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    border-color:rgba(255,255,255,.14);
  }
  .box.method .method-title{font-size:14px;font-weight:700;line-height:1.32;display:block}
  .box.method .method-cap{font-size:11px;font-weight:600;color:var(--cap);line-height:1.2;display:block}
  .box:hover,.stack .seg:hover{background:var(--card-grad-hi);border-color:rgba(255,255,255,.18);transform:translateY(-2px);box-shadow:var(--lift-hi)}
  .box.method:hover{background:var(--card-grad-hi)}
  .box:focus-visible,.stack .seg:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .box.on{border-color:var(--red);box-shadow:0 10px 30px rgba(244,98,107,.16), inset 0 1px 0 rgba(255,255,255,.05)}
  .box.method.on .method-cap{color:var(--red)}
  .team-card{
    width:100%;background:var(--card-grad);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--lift);overflow:hidden;transition:.18s;
  }
  .team-card.on{border-color:var(--red);box-shadow:0 10px 30px rgba(244,98,107,.16), inset 0 1px 0 rgba(255,255,255,.05)}
  .team-header{
    padding:12px 18px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--red);border-bottom:1px solid var(--line);background:rgba(244,98,107,.07);line-height:1.35;
  }
  .stack{width:100%;background:transparent;border:0;border-radius:0;box-shadow:none;overflow:hidden}
  .stack .seg{
    display:block;width:100%;background:transparent;border:0;padding:13px 18px;text-align:left;
    font-family:inherit;cursor:pointer;transition:.18s;
  }
  .stack .seg + .seg{border-top:1px dotted rgba(255,255,255,.15)}
  .stack .seg .t{font-size:12px;font-weight:600;line-height:1.42;color:var(--ink);display:block}
  .stack .seg.on{background:rgba(244,98,107,.09)}
  .signal{
    width:100%;max-width:1180px;background:var(--red-tint);border:1px solid var(--red-line);border-radius:var(--radius);
    padding:18px 22px;font-size:13px;font-weight:600;line-height:1.45;color:var(--ink);text-align:center;
    box-shadow:0 10px 30px rgba(244,98,107,.12), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .signal .lab{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--red);margin-bottom:8px}
  .tip{
    position:fixed;z-index:50;top:0;left:0;width:max-content;max-width:min(300px,calc(100vw - 20px));
    background:linear-gradient(180deg,#302F2C 0%,#232220 100%);border:1px solid rgba(255,255,255,.10);
    color:#F3F1ED;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.45;font-family:var(--font);
    box-shadow:0 12px 34px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(3px);
    transition:opacity .13s ease,transform .13s ease,visibility .13s;pointer-events:none;
  }
  .tip.show{opacity:1;visibility:visible;transform:translateY(0)}
  .tip::after{content:"";position:absolute;left:var(--ax,50%);margin-left:-5px;border:5px solid transparent}
  .tip[data-side="top"]::after{top:100%;border-top-color:#232220}
  .tip[data-side="bottom"]::after{bottom:100%;border-bottom-color:#302F2C}

  .v-arrow{
    display:none;flex:none;flex-direction:column;align-items:center;width:12px;height:22px;
    margin:8px auto;
  }
  .v-arrow i{display:block;width:1.4px;flex:1;background:var(--wire)}
  .v-arrow b{
    display:block;width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;
    border-top:7px solid var(--wire);border-bottom:0;
  }
  .method-sublabel{display:none}

  @media (max-width:600px),(orientation:portrait) and (max-width:700px){
    html.is-mobile-layout svg#links{display:none!important}
    svg#links{display:none!important}
    .canvas{padding:4px 8px 12px}
    .vflow{gap:0;align-items:stretch;width:100%}
    .v-arrow{display:flex}
    .row{flex-direction:column;align-items:stretch;gap:10px;width:100%;max-width:none;padding:0}
    .row.decisions,.row.methods{gap:12px}
    .nodewrap,.nodewrap.center,.nodewrap.wide{max-width:none;width:100%}
    .box{font-size:14px;line-height:1.35;padding:16px 14px}
    .box.decision{font-size:13px;font-weight:600;text-align:left}
    .box.method{
      min-height:0;padding:18px 14px;align-items:flex-start;text-align:left;gap:6px;
    }
    .box.method .method-title{font-size:14px;text-align:left}
    .box.method .method-cap{font-size:11px;margin-top:2px;text-align:left}
    .method-sublabel{
      display:block;font-size:11px;font-weight:500;color:var(--cap);line-height:1.45;
      margin-top:8px;text-align:left;
    }
    .team-header{font-size:11px;line-height:1.35;padding:14px 12px}
    .stack .seg{padding:14px 12px;text-align:left}
    .stack .seg .t{font-size:13px;line-height:1.4}
    .signal{font-size:13px;line-height:1.45;padding:18px 14px;text-align:left}
    .signal .lab{font-size:11px;margin-bottom:8px}
    .tip{display:none!important}
  }

  html.is-embed.is-mobile-narrow{overflow:hidden}
  html.is-embed.is-mobile-narrow body{padding:8px 6px 14px;overflow:hidden}
  html.is-embed.is-mobile-narrow .canvas{padding:0 4px 8px}
  html.is-embed.is-mobile-narrow .vflow{padding-top:0}
</style>
</head>
<body>
<div class="page">
  <div class="canvas" id="canvas">
    <svg id="links" aria-hidden="true"></svg>
    <div class="vflow">
      <div class="nodewrap center">
        <button type="button" class="box" id="n-diag" data-node="diag"
          data-tip="Deuda, fuentes de verdad, plataformas (web, Android, iOS) y políticas del cliente">Diagnosticar la cuenta</button>
      </div>
      <div class="v-arrow" aria-hidden="true"><i></i><b></b></div>
      <div class="row decisions">
        <div class="nodewrap">
          <button type="button" class="box decision" id="n-hist" data-node="hist"
            data-tip="Poco histórico abre caminos sin Figma; mucho histórico empuja a contratos sobre Figma">¿Cuánto histórico hay en Figma?</button>
        </div>
        <div class="v-arrow" aria-hidden="true"><i></i><b></b></div>
        <div class="nodewrap">
          <button type="button" class="box decision" id="n-ctrl" data-node="ctrl"
            data-tip="Políticas del cliente y acceso a repos definen cuánto podemos elegir herramientas">¿Cuánto control tenemos sobre herramientas e implementación?</button>
        </div>
      </div>
      <div class="v-arrow" aria-hidden="true"><i></i><b></b></div>
      <div class="row methods">
        <div class="nodewrap">
          <button type="button" class="box method" id="n-volaris" data-node="volaris"
            data-tip="Mucho histórico y muchas fuentes de verdad: Figma se queda, el contrato sellado es la verdad que engineering implementa.">
            <span class="method-title">Contratos JSON + Figma</span>
            <span class="method-cap">como Volaris</span>
          </button>
        </div>
        <div class="nodewrap">
          <button type="button" class="box method" id="n-bain" data-node="bain"
            data-tip="Figma obligatorio por política: se diseña en código con el DS del cliente y Figma queda como espejo.">
            <span class="method-title">Híbrido: diseño en HTML + Figma</span>
            <span class="method-cap">como Bain</span>
          </button>
        </div>
        <div class="nodewrap">
          <button type="button" class="box method" id="n-knewton" data-node="knewton"
            data-tip="Poco histórico y control total: SDD y diseño en Pencil.dev, sin Figma.">
            <span class="method-title">Diseñar en código, sin Figma</span>
            <span class="method-cap">como Knewton</span>
          </button>
        </div>
      </div>
      <div class="v-arrow" aria-hidden="true"><i></i><b></b></div>
      <div class="nodewrap wide">
        <div class="team-card" id="n-team-card">
          <div class="team-header" id="n-team-header">Para cualquier camino (lo que proponemos hoy)</div>
          <div class="stack" id="n-team">
            <button type="button" class="seg" data-node="team1"
              data-tip="Formar a todo el equipo según el método de cada cuenta, incluyendo repositorios y SDD a nivel fundamental."><span class="t">Formar a todo el equipo según el método de cada cuenta, incluyendo repositorios y SDD a nivel fundamental.</span></button>
            <button type="button" class="seg" data-node="team2"
              data-tip="Contratar distinto a los próximos: perfiles con base técnica."><span class="t">Contratar distinto a los próximos: perfiles con base técnica.</span></button>
            <button type="button" class="seg" data-node="team3"
              data-tip="Empaquetar lo que ya funcionó (Volaris, Bain, Knewton) en plantillas y agentes."><span class="t">Empaquetar lo que ya funcionó (Volaris, Bain, Knewton) en plantillas y agentes.</span></button>
          </div>
        </div>
      </div>
      <div class="v-arrow" aria-hidden="true"><i></i><b></b></div>
      <div class="signal" id="n-signal" data-node="signal" aria-label="Señal clave"
        data-tip="Asentar esta práctica en Diseño tomará 3–6 meses: proceso nuevo (cliente + interno) y curva técnica + accesos que hoy el equipo no tiene.">
        <span class="lab">SEÑAL CLAVE</span>
        Asentar esta práctica en Diseño tomará 3–6 meses: proceso nuevo (cliente + interno) y curva técnica + accesos que hoy el equipo no tiene.
      </div>
    </div>
  </div>
</div>
<div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>
<script>
(function(){
  if (window.self !== window.top) {
    document.documentElement.classList.add('is-embed');
    document.body.classList.add('is-embed-body');
  }
  const canvas = document.getElementById('canvas');
  const svg = document.getElementById('links');
  const tip = document.getElementById('tip');
  let current = null;

  const snap = (n) => Math.round(n) + 0.5;

  const cx = (el) => el.getBoundingClientRect().left + el.getBoundingClientRect().width / 2;
  const top = (el) => el.getBoundingClientRect().top;
  const bottom = (el) => el.getBoundingClientRect().bottom;

  /** Same vertical wire + arrowhead as slide 7 design-os diagram */
  function wireDown(x, yFrom, yTo, linkId, forNodes){
    const tip = yTo;
    const bx = tip - 7;
    const forAttr = forNodes.join(',');
    return `<g data-link="${linkId}" data-for="${forAttr}">`
      + `<path d="M ${x} ${yFrom} L ${x} ${bx}"/>`
      + `<polygon points="${x},${tip} ${x-4.5},${bx} ${x+4.5},${bx}"/>`
      + `</g>`;
  }

  function wireH(x1, x2, y, linkId, forNodes){
    const forAttr = forNodes.join(',');
    return `<g data-link="${linkId}" data-for="${forAttr}"><path d="M ${x1} ${y} L ${x2} ${y}"/></g>`;
  }

  function wirePath(d, linkId, forNodes){
    const forAttr = forNodes.join(',');
    return `<g data-link="${linkId}" data-for="${forAttr}"><path d="${d}"/></g>`;
  }

  const LINK_FOR = {
    diag: ['stem-diag', 'bus-q', 'tap-hist', 'tap-ctrl'],
    hist: ['tap-hist', 'stem-hist', 'bus-m'],
    ctrl: ['tap-ctrl', 'stem-ctrl', 'bus-m'],
    volaris: ['bus-m', 'drop-volaris', 'bus-t', 'stem-volaris'],
    bain: ['bus-m', 'drop-bain', 'bus-t', 'stem-bain'],
    knewton: ['bus-m', 'drop-knewton', 'bus-t', 'stem-knewton'],
    team1: ['bus-t', 'drop-team', 'stem-signal'],
    team2: ['bus-t', 'drop-team', 'stem-signal'],
    team3: ['bus-t', 'drop-team', 'stem-signal'],
    signal: ['stem-signal'],
  };

  function isMobileNarrow(){
    return document.documentElement.classList.contains('is-mobile-narrow')
      || window.matchMedia('(max-width:600px)').matches
      || (window.matchMedia('(orientation:portrait)').matches && window.innerWidth <= 700);
  }

  function syncMobileSublabels(){
    const mobile = isMobileNarrow();
    document.documentElement.classList.toggle('is-mobile-layout', mobile);
    document.querySelectorAll('.box.method').forEach((btn) => {
      let sub = btn.querySelector('.method-sublabel');
      if (mobile && btn.dataset.tip) {
        if (!sub) {
          sub = document.createElement('span');
          sub.className = 'method-sublabel';
          btn.appendChild(sub);
        }
        sub.textContent = btn.dataset.tip;
      } else if (sub) {
        sub.remove();
      }
    });
  }

  function drawLinks(){
    if (isMobileNarrow()) {
      svg.innerHTML = '';
      return;
    }
    const base = canvas.getBoundingClientRect();
    const W = canvas.clientWidth, H = canvas.clientHeight;
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const rel = (x,y) => ({ x: x - base.left, y: y - base.top });

    const diag = document.getElementById('n-diag');
    const hist = document.getElementById('n-hist');
    const ctrl = document.getElementById('n-ctrl');
    const methods = ['n-volaris','n-bain','n-knewton'].map(id => document.getElementById(id));
    const teamCard = document.getElementById('n-team-card');
    const signal = document.getElementById('n-signal');

    const dX = snap(rel(cx(diag), 0).x);
    const dB = rel(cx(diag), bottom(diag) + 4).y;
    const hX = snap(rel(cx(hist), 0).x);
    const cX = snap(rel(cx(ctrl), 0).x);
    const hT = rel(cx(hist), top(hist) - 4).y;
    const cT = rel(cx(ctrl), top(ctrl) - 4).y;
    const hB = rel(cx(hist), bottom(hist) + 4).y;
    const cB = rel(cx(ctrl), bottom(ctrl) + 4).y;

    const busQ = snap((dB + hT) / 2);
    const mx = methods.map((m) => snap(rel(cx(m), 0).x));
    const mT = methods.map((m) => rel(cx(m), top(m) - 4).y);
    const mB = methods.map((m) => rel(cx(m), bottom(m) + 4).y);
    const busM = snap((Math.max(hB, cB) + mT[1]) / 2);

    const teamX = snap(rel(cx(teamCard), 0).x);
    const teamT = rel(cx(teamCard), top(teamCard) - 4).y;
    const teamB = rel(cx(teamCard), bottom(teamCard) + 4).y;
    const busT = snap((Math.max(...mB) + teamT) / 2);

    const sigX = snap(rel(cx(signal), 0).x);
    const sigT = rel(cx(signal), top(signal) - 4).y;

    const qLeft = Math.min(hX, cX, dX);
    const qRight = Math.max(hX, cX, dX);
    const mLeft = Math.min(...mx);
    const mRight = Math.max(...mx);

    let out = '';
    out += wirePath(`M ${dX} ${dB} L ${dX} ${busQ}`, 'stem-diag', ['diag', 'bus-q', 'tap-hist', 'tap-ctrl']);
    out += wireH(qLeft, qRight, busQ, 'bus-q', ['diag', 'hist', 'ctrl', 'tap-hist', 'tap-ctrl']);
    out += wireDown(hX, busQ, hT, 'tap-hist', ['diag', 'hist', 'tap-hist']);
    out += wireDown(cX, busQ, cT, 'tap-ctrl', ['diag', 'ctrl', 'tap-ctrl']);

    out += wirePath(`M ${hX} ${hB} L ${hX} ${busM}`, 'stem-hist', ['hist', 'bus-m']);
    out += wirePath(`M ${cX} ${cB} L ${cX} ${busM}`, 'stem-ctrl', ['ctrl', 'bus-m']);
    out += wireH(mLeft, mRight, busM, 'bus-m', ['hist', 'ctrl', 'volaris', 'bain', 'knewton']);
    methods.forEach((m, i) => {
      const id = m.id.replace('n-', '');
      out += wireDown(mx[i], busM, mT[i], `drop-${id}`, ['hist', 'ctrl', id, 'bus-m']);
    });

    methods.forEach((m, i) => {
      const id = m.id.replace('n-', '');
      out += wirePath(`M ${mx[i]} ${mB[i]} L ${mx[i]} ${busT}`, `stem-${id}`, [id, 'bus-t']);
    });
    out += wireH(mLeft, mRight, busT, 'bus-t', ['volaris', 'bain', 'knewton', 'team1', 'team2', 'team3']);
    out += wireDown(teamX, busT, teamT, 'drop-team', ['volaris', 'bain', 'knewton', 'team1', 'team2', 'team3', 'bus-t']);

    out += wireDown(teamX, teamB, sigT, 'stem-signal', ['team1', 'team2', 'team3', 'signal']);

    svg.innerHTML = out;
  }

  function relayout(){
    syncMobileSublabels();
    drawLinks();
  }
  window.decisionRelayout = relayout;
  window.addEventListener('resize', relayout);
  window.addEventListener('load', relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(canvas);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  relayout();

  function highlight(el, on){
    const key = el.dataset.node;
    if (el.classList.contains('seg')) el.classList.toggle('on', on);
    else el.classList.toggle('on', on);
    if (el.closest('.team-card') && on) document.getElementById('n-team-card').classList.add('on');
    else if (!on && !document.querySelector('.seg.on')) document.getElementById('n-team-card').classList.remove('on');
    canvas.classList.toggle('dimmed', on);
    const links = key && LINK_FOR[key] ? LINK_FOR[key] : [];
    svg.querySelectorAll('g[data-link]').forEach((g) => {
      const id = g.getAttribute('data-link');
      g.classList.toggle('on', on && links.includes(id));
    });
  }

  function place(el){
    tip.style.left = '0px'; tip.style.top = '0px';
    const r = el.getBoundingClientRect();
    const t = tip.getBoundingClientRect();
    const gap = 10, pad = 8;
    let side = 'top';
    let topPos = r.top - t.height - gap;
    if (topPos < pad){ side = 'bottom'; topPos = r.bottom + gap; }
    topPos = Math.max(pad, Math.min(topPos, window.innerHeight - t.height - pad));
    let left = r.left + r.width/2 - t.width/2;
    left = Math.max(pad, Math.min(left, window.innerWidth - t.width - pad));
    tip.style.top = Math.round(topPos) + 'px';
    tip.style.left = Math.round(left) + 'px';
    tip.dataset.side = side;
    tip.style.setProperty('--ax', Math.round(r.left + r.width/2 - left) + 'px');
  }

  function show(el){
    const text = el.dataset.tip;
    if (!text) return;
    current = el;
    tip.textContent = text;
    tip.classList.add('show');
    tip.setAttribute('aria-hidden','false');
    place(el);
    if (el.dataset.node) highlight(el, true);
  }
  function hide(){
    if (current && current.dataset.node) highlight(current, false);
    current = null;
    tip.classList.remove('show');
    tip.setAttribute('aria-hidden','true');
    canvas.classList.remove('dimmed');
  }

  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter', ()=>show(el));
    el.addEventListener('mouseleave', hide);
    el.addEventListener('focus', ()=>show(el));
    el.addEventListener('blur', hide);
  });
  document.addEventListener('keydown', e=>{ if (e.key === 'Escape') hide(); });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
})();
</script>
</body>
</html>
