.dimmed #wires g:not(.on){opacity:.18}
.frame-label{position:absolute;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:7px;padding:0 9px;line-height:16px;color:var(--ink);transition:opacity .18s}

.dimmed .frame-label:not(.on){opacity:.3}
.box{position:absolute;background:var(--card-grad);border:1px solid var(--line);border-radius:var(--radius);

.tip{position:fixed;z-index:50;top:0;left:0;max-width:280px;background:linear-gradient(180deg,#302F2C 0%,#232220 100%);border:1px solid rgba(255,255,255,.10);color:#F3F1ED;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.45;box-shadow:0 12px 34px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(3px);transition:opacity .13s,transform .13s,visibility .13s;pointer-events:none}
.tip.show{opacity:1;visibility:visible;transform:none}
@media (prefers-reduced-motion:reduce){.glow-bg::before{animation:none}*{transition:none!important}}
.elabel{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;font-weight:500;color:var(--cap);background:var(--bg);padding:1px 7px;border-radius:6px;white-space:nowrap;z-index:1;transition:opacity .18s,color .18s;pointer-events:none}

<div class="wrap">

<script>
const D=JSON.parse(document.getElementById("diagram-data").textContent);
const DW=D.nodeW||150,DH=D.nodeH||60;
const N={},G={};
(D.nodes||[]).forEach(n=>{N[n.id]=Object.assign({w:DW,h:DH},n)});
(D.groups||[]).forEach(g=>{G[g.id]=g});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.title=D.title||"Diagrama";
document.getElementById("eyebrow").textContent=D.eyebrow||"";
document.getElementById("title").textContent=D.title||"";
document.getElementById("subtitle").textContent=D.subtitle||"";
const cv=document.getElementById("canvas");cv.style.width=(D.width||1360)+"px";cv.style.height=(D.height||740)+"px";
const wires=document.getElementById("wires"),frames=document.getElementById("frames");
const NS="http://www.w3.org/2000/svg",mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const cx=n=>n.x+n.w/2,cy=n=>n.y+n.h/2;
// port on node n facing point p (orthogonal)
function port(n,p){const[px,py]=p;
 if(px>=n.x&&px<=n.x+n.w)return[px,py<n.y?n.y:n.y+n.h];
 if(py>=n.y&&py<=n.y+n.h)return[px<n.x?n.x:n.x+n.w,py];
 return Math.abs(py-cy(n))>Math.abs(px-cx(n))?[cx(n),py<n.y?n.y:n.y+n.h]:[px<n.x?n.x:n.x+n.w,cy(n)];}
function autoRoute(a,b){
 if(b.y<a.y+a.h&&b.y+b.h>a.y){const y=(Math.max(a.y,b.y)+Math.min(a.y+a.h,b.y+b.h))/2;return b.x>a.x?[[a.x+a.w,y],[b.x,y]]:[[a.x,y],[b.x+b.w,y]];}
 if(b.x<a.x+a.w&&b.x+b.w>a.x){const x=(Math.max(a.x,b.x)+Math.min(a.x+a.w,b.x+b.w))/2;return b.y>a.y?[[x,a.y+a.h],[x,b.y]]:[[x,a.y],[x,b.y+b.h]];}
 const down=b.y>a.y,y0=down?a.y+a.h:a.y,y1=down?b.y:b.y+b.h,m=(y0+y1)/2;return[[cx(a),y0],[cx(a),m],[cx(b),m],[cx(b),y1]];}
function pointsFor(e){const a=N[e.from],b=N[e.to];if(!e.route||!e.route.length)return autoRoute(a,b);
 const r=e.route;return[port(a,r[0]),...r,port(b,r[r.length-1])];}
function rpath(pts,r=10){pts=pts.filter((p,i)=>i===0||p[0]!==pts[i-1][0]||p[1]!==pts[i-1][1]);
 const last=pts[pts.length-1],prev=pts[pts.length-2];const dx=Math.sign(last[0]-prev[0]),dy=Math.sign(last[1]-prev[1]);
 const end=[last[0]-dx*7,last[1]-dy*7];const P=[...pts.slice(0,-1),end];let d=`M${P[0][0]},${P[0][1]}`;
 for(let i=1;i<P.length-1;i++){const[a,b,c]=[P[i-1],P[i],P[i+1]];const l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);const rr=Math.min(r,l1/2,l2/2);
  const p1=[b[0]+(a[0]-b[0])/l1*rr,b[1]+(a[1]-b[1])/l1*rr],p2=[b[0]+(c[0]-b[0])/l2*rr,b[1]+(c[1]-b[1])/l2*rr];d+=` L${p1} Q${b} ${p2}`;}
 d+=` L${end}`;const px=-dy,py=dx;const head=[[last[0],last[1]],[end[0]+px*4.5,end[1]+py*4.5],[end[0]-px*4.5,end[1]-py*4.5]];return[d,head.map(p=>p.join(",")).join(" ")]}
const W_=[];
(D.edges||[]).forEach(e=>{if(!N[e.from]||!N[e.to]){console.warn("edge with unknown node",e);return;}
 const pts=pointsFor(e),g=mk("g",{},wires),[d,h]=rpath(pts);mk("path",{d},g);mk("polygon",{points:h},g);let lab=null;
 if(e.label){let best=0,bi=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);if(l>best){best=l;bi=i}}
  lab=document.createElement("span");lab.className="elabel";lab.textContent=e.label;lab.style.left=(pts[bi-1][0]+pts[bi][0])/2+"px";lab.style.top=(pts[bi-1][1]+pts[bi][1])/2+"px";cv.appendChild(lab);}
 W_.push({a:e.from,b:e.to,g,lab});});
const labels={};
for(const k in G){const f=G[k];const lab=document.createElement("span");lab.className="frame-label"+(f.accent?" red":"");lab.textContent=f.label;lab.dataset.tip=f.tip||"";
 lab.style.left=(f.x+26)+"px";lab.style.top=(f.y-8)+"px";cv.appendChild(lab);labels[k]=lab;}
function drawFrames(){frames.innerHTML="";for(const k in G){const f=G[k],g=mk("g",{class:"fr"+(f.accent?" red":"")},frames),r=14;
 mk("rect",{x:f.x,y:f.y,width:f.w,height:f.h,rx:r},g);const gx0=f.x+26,gx1=gx0+labels[k].offsetWidth;
 mk("path",{d:`M${gx1},${f.y} H${f.x+f.w-r} Q${f.x+f.w},${f.y} ${f.x+f.w},${f.y+r} V${f.y+f.h-r} Q${f.x+f.w},${f.y+f.h} ${f.x+f.w-r},${f.y+f.h} H${f.x+r} Q${f.x},${f.y+f.h} ${f.x},${f.y+f.h-r} V${f.y+r} Q${f.x},${f.y} ${f.x+r},${f.y} H${gx0}`},g);}}
const boxes={},tip=document.getElementById("tip"),det=document.getElementById("detail");
let pinned=null;
for(const k in N){const n=N[k],b=document.createElement("button");b.className="box";b.style.left=n.x+"px";b.style.top=n.y+"px";b.style.width=n.w+"px";b.style.height=n.h+"px";
 b.innerHTML=`<span class="t">${esc(n.label)}</span>`+(n.caption?`<span class="s">${esc(n.caption)}</span>`:"");cv.appendChild(b);boxes[k]=b;
 b.addEventListener("mouseenter",()=>{sel(k);if(n.desc)showTip(b,n.desc)});b.addEventListener("mouseleave",()=>{tip.classList.remove("show");sel(pinned)});
 b.addEventListener("click",()=>{pinned=pinned===k?null:k;sel(pinned||k)});b.addEventListener("focus",()=>sel(k));b.addEventListener("blur",()=>sel(pinned));}
for(const k in labels){const l=labels[k];if(!l.dataset.tip)continue;l.style.cursor="help";l.addEventListener("mouseenter",()=>showTip(l,l.dataset.tip));l.addEventListener("mouseleave",()=>tip.classList.remove("show"));}
function showTip(el,txt){tip.textContent=txt;tip.classList.add("show");const r=el.getBoundingClientRect(),t=tip.getBoundingClientRect();
 tip.style.left=Math.max(8,r.left+r.width/2-t.width/2)+"px";tip.style.top=Math.max(8,r.top-t.height-10)+"px";}
function sel(k){cv.classList.toggle("dimmed",!!k);
 const nb=new Set(k?[k]:[]);W_.forEach(e=>{if(e.a===k)nb.add(e.b);if(e.b===k)nb.add(e.a)});
 W_.forEach(e=>{const on=!!k&&(e.a===k||e.b===k);e.g.classList.toggle("on",on);if(e.lab)e.lab.classList.toggle("on",on)});
 for(const j in boxes)boxes[j].classList.toggle("on",nb.has(j));
 for(const f in labels)labels[f].classList.toggle("on",!!k&&[...nb].some(j=>N[j].group===f));
 det.innerHTML=k?`<b>${esc(N[k].label)}${N[k].caption?" · "+esc(N[k].caption):""}</b><span>${esc(N[k].desc)}</span>`:`<span style="color:var(--muted)">${esc(D.caption)}</span>`;}
(document.fonts?document.fonts.ready:Promise.resolve()).then(drawFrames);drawFrames();sel(null);
</script>

<script>
(function(){
 const EMBED=/[?&]embed=1/.test(location.search);
 const cv=document.getElementById("canvas"),host=document.createElement("div");host.className="fit-host";
 cv.parentNode.insertBefore(host,cv);host.appendChild(cv);
 const W=D.width||1360,H=D.height||740,det=document.getElementById("detail");
 function fit(){
  const wrap=document.querySelector(".wrap"),cs=getComputedStyle(wrap);
  const pad=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
  let s=Math.min(1,(document.documentElement.clientWidth-pad)/W);
  if(W>600&&!EMBED){const top=host.getBoundingClientRect().top+window.scrollY;
   const avH=window.innerHeight-top-det.offsetHeight-parseFloat(cs.paddingBottom)-8; s=Math.min(s,Math.max(.5,avH/H));}
  cv.style.transform="scale("+s+")";host.style.width=W*s+"px";host.style.height=H*s+"px";
 }
 fit();addEventListener("resize",fit);(document.fonts?document.fonts.ready:Promise.resolve()).then(fit);
 cv.querySelectorAll(".box").forEach(b=>b.addEventListener("click",()=>{
  const r=det.getBoundingClientRect();
  if(EMBED)return;
  if(r.bottom>window.innerHeight||r.top<0)det.scrollIntoView({behavior:"smooth",block:"nearest"});}));
})();
</script>

<style id="pointer-aware">.no-tip .tip{display:none!important}</style>
<script>/* vertical version: touch shows only the detail panel (no floating tooltip over the node above);
   a mouse keeps the tooltip and the subtitle says "Haz clic" instead of "Toca" */
(function(){
 var R=document.documentElement,mq=matchMedia("(hover: none), (pointer: coarse)");
 function upd(){R.classList.toggle("no-tip",mq.matches)}upd();if(mq.addEventListener)mq.addEventListener("change",upd);
 addEventListener("touchstart",function(){R.classList.add("no-tip")},{capture:true,passive:true});
 addEventListener("pointerdown",function(e){if(e.pointerType&&e.pointerType!=="mouse")R.classList.add("no-tip");else if(e.pointerType==="mouse"&&!mq.matches)R.classList.remove("no-tip")},true);
 var s=document.getElementById("subtitle");
 if(s&&matchMedia("(hover: hover) and (pointer: fine)").matches){s.textContent=s.textContent.replace(/^Toca una etapa/,"Haz clic en una etapa").replace(/^Toca un paso/,"Haz clic en un paso")}
 else if(s&&mq.matches){s.textContent=s.textContent.replace(/^Pasa el cursor o haz clic en/,"Toca")}
})();
</script>

<style id="embed">
.embed body{background:transparent;min-height:0;overflow-x:hidden}
.embed .glow-bg,.embed .eyebrow,.embed #title{display:none!important}
.embed .wrap{padding:0 4px 2px!important;width:auto}

/* the detail stays pinned to the bottom of the frame, so a tap never needs to scroll the diagram */
.embed.fscroll .detail{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:6px 0 4px;margin-top:0;box-shadow:0 -10px 14px -6px var(--bg)}
.embed .elabel{font-size:11px}
</style>
<script>/* deselect: second tap/click on the selected node, tap/click on empty background, or Escape */
(function(){
 function clear(){pinned=null;sel(null);const a=document.activeElement;if(a&&a.classList&&a.classList.contains("box"))a.blur();tip.classList.remove("show");}
 cv.querySelectorAll(".box").forEach(b=>b.addEventListener("click",e=>{if(!pinned){b.blur();sel(null);tip.classList.remove("show")}}));
 document.addEventListener("click",e=>{if(!e.target.closest(".box")&&pinned)clear()});
 addEventListener("keydown",e=>{if(e.key==="Escape"&&(pinned||document.activeElement&&document.activeElement.classList.contains("box"))){e.preventDefault();clear()}});
})();
</script>
<script>/* embedded in the deck: send height, forward slide keys, never trap navigation */
(function(){
 if(!/[?&]embed=1/.test(location.search))return;
 document.documentElement.classList.add("embed");
 const wrap=document.querySelector(".wrap"),det=document.getElementById("detail"),send=m=>{try{parent.postMessage(Object.assign({src:"hid-diagram"},m),"*")}catch(e){}};
 const flag=()=>document.documentElement.classList.toggle("fscroll",document.documentElement.scrollHeight>innerHeight+2);
 const post=()=>{send({type:"size",h:Math.ceil(wrap.getBoundingClientRect().height)+2});requestAnimationFrame(flag)};addEventListener("resize",flag);
 if(window.ResizeObserver)new ResizeObserver(post).observe(wrap);addEventListener("load",post);post();
 (document.fonts?document.fonts.ready:Promise.resolve()).then(post);
 addEventListener("keydown",e=>{if(["ArrowRight","ArrowLeft","PageUp","PageDown","Home","End"].includes(e.key)){e.preventDefault();send({type:"key",key:e.key})}});
 /* horizontal swipe inside the diagram changes slide (vertical scrolling is left alone) */
 let sx=null,sy=0,st=0;
 addEventListener("touchstart",e=>{if(e.touches.length!==1){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
 addEventListener("touchend",e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Date.now()-st>900||Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;send({type:"swipe",dir:dx<0?1:-1})},{passive:true});
 document.querySelectorAll(".box").forEach(b=>b.addEventListener("click",()=>setTimeout(()=>{const r=det.getBoundingClientRect(),nb=b.getBoundingClientRect(),se=document.scrollingElement;
  /* bring the detail into view, but never push the tapped node out of view */
  const over=r.bottom-innerHeight;if(over>1)se.scrollTop+=Math.min(over+8,Math.max(0,nb.top-36));
  const r2=det.getBoundingClientRect(),n2=b.getBoundingClientRect();send({type:"reveal",top:r2.top,bottom:r2.bottom,nodeTop:n2.top})},60)));
})();
</script>

<style id="movil-type">/* vertical version: node subtitles and group labels stay >=12px on phones */
.box .s{font-size:12.5px;line-height:1.3}.frame-label{font-size:12.5px;letter-spacing:.08em}.embed .elabel{font-size:12px}
.no-tip .tip,.embed .tip{display:none!important}
</style>
